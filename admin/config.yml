          - { label: "Hero Headline", name: "hero_headline", widget: "string", hint: "Contains a <span> tag around part of the line — edit carefully" }
          - { label: "Hero Lead Text", name: "hero_lead", widget: "text" }
          - label: "Certification Programs"
            name: "programs"
            widget: "list"
            hint: "Verify each program's exact name, covered makes, and status before launch — see docs/LAUNCH-BLOCKERS.md"
            fields:
              - { label: "Order Number (e.g. 01)", name: "number", widget: "string" }
              - { label: "Make Count Label (e.g. 1 make / 4 makes)", name: "count_label", widget: "string" }
              - { label: "Program Name (kicker)", name: "kicker", widget: "string" }
              - { label: "Title (short)", name: "title", widget: "string" }
              - { label: "Make Tags", name: "make_tags", widget: "string", hint: "One <span>Make</span> per covered make, e.g. <span>Honda</span><span>Acura</span>" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Card Class", name: "card_class", widget: "hidden", default: "" }
              - { label: "Wrap A Open", name: "wrap_a_open", widget: "hidden", default: "" }
              - { label: "Wrap A Close", name: "wrap_a_close", widget: "hidden", default: "" }
              - { label: "Wrap B Open", name: "wrap_b_open", widget: "hidden", default: "" }
              - { label: "Wrap B Close", name: "wrap_b_close", widget: "hidden", default: "" }

